name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: 🚀 Deploy SPA to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web SPA for GitHub Pages
        run: npx vite build --config vite.mobile.config.ts --base /app/

      - name: Prepare GitHub Pages Static Artifacts
        run: |
          cp dist/mobile/index.html dist/mobile/404.html
          touch dist/mobile/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/mobile'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
